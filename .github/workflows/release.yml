name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod

      - name: Build z_mdm_agent
        working-directory: agent
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          go build -trimpath \
            -ldflags "-s -w -H=windowsgui -X main.version=${VERSION}" \
            -o "z_mdm_agent_${VERSION}.exe" .
          sha256sum "z_mdm_agent_${VERSION}.exe" > checksums.txt

      - uses: actions/upload-artifact@v4
        with:
          name: z-mdm-agent
          path: |
            agent/z_mdm_agent_*.exe
            agent/checksums.txt

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/z_mdm_agent_*.exe
            dist/checksums.txt
